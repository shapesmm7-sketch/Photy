workflows:
  native-android:
    name: Snap Clean Android Build
    max_build_duration: 60
    environment:
      java: 17
      node: 22
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build Web App
        script: |
          npm run build
      - name: Sync Capacitor Android
        script: |
          npx cap sync android
      - name: Set up local.properties
        script: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build Android Debug APK
        script: |
          cd android
          # Fix for potentially corrupt wrapper jarfile and gradle state
          rm -rf .gradle
          rm -f gradle/wrapper/gradle-wrapper.jar
          # Use system gradle to regenerate the wrapper correctly
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --no-build-cache --stacktrace --info
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
      - android/app/build/outputs/bundle/**/*.aab
      - android/app/build/outputs/**/mapping.txt
