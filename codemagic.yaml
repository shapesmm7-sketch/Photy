workflows:
  native-android:
    name: Shot Clean Android Build
    max_build_duration: 60
    environment:
      java: 21
      node: 22
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build Web App
        script: |
          npm run build
      - name: Sync Capacitor Android
        script: |
          npx cap sync android
      - name: Set up local.properties
        script: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build Android Debug APK
        script: |
          cd android
          # Fix for potentially corrupt wrapper jarfile
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          chmod +x gradlew
          # Run sync again to ensure everything is matched with root
          npx cap sync android
          ./gradlew clean assembleDebug --no-daemon --no-build-cache --stacktrace --info -Dorg.gradle.vfs.watch=false
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
      - android/app/build/outputs/bundle/**/*.aab
      - android/app/build/outputs/**/mapping.txt
