workflows:
  native-android:
    name: Snap Clean Android Build
    max_build_duration: 60
    environment:
      java: 17
      node: 22
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build Web App
        script: |
          npm run build
      - name: Sync Capacitor Android
        script: |
          npx cap sync android
      - name: Set up local.properties
        script: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build Android Debug APK
        script: |
          cd android
          # Wipe global gradle cache to fix corrupted jar issues
          rm -rf ~/.gradle/caches/ || true
          # Remove potentially corrupt wrapper files first
          rm -f gradle/wrapper/gradle-wrapper.jar
          # Regenerate gradle wrapper to fix corrupt jarfile issue
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace --info
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
      - android/app/build/outputs/bundle/**/*.aab
      - android/app/build/outputs/**/mapping.txt
