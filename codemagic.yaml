workflows:
  native-android:
    name: Snap Clean Android Build
    max_build_duration: 60
    working_directory: android
    environment:
      java: 21
      # Uncomment the following lines to use Android signing via Codemagic UI:
      # android_signing:
      #   - keystore_reference
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Generate Gradle Wrapper
        script: |
          # Since the project is newly created and might lack the wrapper files, we generate them first
          gradle wrapper --gradle-version 8.4
      - name: Build Android Debug APK
        script: |
          ./gradlew assembleDebug
      # - name: Build Android Release App Bundle (AAB)
      #   script: |
      #     ./gradlew bundleRelease
    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/bundle/**/*.aab
      - app/build/outputs/**/mapping.txt
